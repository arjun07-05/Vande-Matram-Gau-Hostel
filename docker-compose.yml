version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gau_hostel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gau_hostel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: gau_hostel_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: 
      context: ./Backend
    container_name: gau_hostel_backend
    volumes:
      - ./Backend:/app
      - backend_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/gau_hostel_db
      - SECRET_KEY=supersecretkey_please_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080  # 7 days for remember me
    ports:
      - "8001:8000"
    depends_on:
      - db
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./Frontend
    container_name: gau_hostel_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
